name: "Terraform CI/CD"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose Terraform action to execute'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform Execution"
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Authenticate to AWS using Access Keys
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Step 3: Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 4: Check formatting
      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true

      # Step 5: Initialize Terraform working directory
      - name: Terraform Init
        run: terraform init

      # Step 6: Generate Terraform execution plan
      - name: Terraform Plan
        run: |
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            terraform plan -destroy
          else
            terraform plan
          fi

      # Step 7: Apply or Destroy based on user selection
      - name: Terraform Execution (Apply or Destroy)
        run: |
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            echo "🔥 Running Terraform Destroy..."
            terraform destroy -auto-approve
          else
            echo "🚀 Running Terraform Apply..."
            terraform apply -auto-approve
          fi